<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hive dashboard</title>
<style>
  :root {
    --bg: #18191c; --panel: #202125; --panel-2: #26282d; --border: #33363c;
    --text: #e6e3dc; --muted: #9b988f; --faint: #6d6b65;
    --amber: #e0a84a; --amber-dim: #5a4520;
    --red: #e5645a; --red-dim: #4a2421;
    --green: #5fb878; --green-dim: #1f3d29;
    --blue: #7f97b2; --blue-dim: #263241;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .app { display: grid; height: 100vh; grid-template-rows: auto auto minmax(0, 1fr) minmax(160px, 30vh);
    grid-template-columns: 290px minmax(0, 1fr) 360px; gap: 1px; background: var(--border); }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    padding: 10px 16px; background: var(--panel); }
  .wordmark { font-weight: 700; letter-spacing: .08em; color: var(--amber); font-size: 18px; }
  .stat { display: flex; flex-direction: column; min-width: 0; }
  .stat .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-family: var(--mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
  .spacer { flex: 1; }
  #banner { grid-column: 1 / -1; padding: 6px 16px; background: var(--panel); font-size: 13px; }
  #banner:empty { display: none; }
  #banner.offline { background: var(--red-dim); color: #ffd6d2; }
  #banner.stale { background: var(--amber-dim); color: #ffe7bf; }
  section.panel { background: var(--bg); overflow: auto; padding: 12px 14px; min-height: 0; }
  #bottom { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1px; background: var(--border); padding: 0; overflow: hidden; }
  #bottom > div { background: var(--bg); overflow: auto; padding: 12px 14px; min-height: 0; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  h3 { font-size: 15px; margin: 0 0 6px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; margin-bottom: 10px; }
  .card.selectable { cursor: pointer; }
  .card.selectable:hover { border-color: #4a4d55; }
  .card.selected { border-color: var(--amber); }
  .row { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }
  .mono { font-family: var(--mono); font-size: 12.5px; }
  .small { font-size: 12px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; border: 1px solid; white-space: nowrap; }
  .b-overlap { color: var(--blue); border-color: var(--blue); background: var(--blue-dim); }
  .b-incompat { color: var(--red); border-color: var(--red); background: var(--red-dim); }
  .b-accepted { color: var(--amber); border-color: var(--amber); background: var(--amber-dim); }
  .b-verified { color: var(--green); border-color: var(--green); background: var(--green-dim); }
  .b-neutral { color: var(--muted); border-color: var(--border); background: var(--panel-2); }
  .b-warn { color: var(--amber); border-color: var(--amber-dim); background: transparent; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .dot.ok { background: var(--green); } .dot.warn { background: var(--amber); } .dot.bad { background: var(--red); } .dot.off { background: var(--faint); }
  pre { margin: 6px 0 0; padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px;
    font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  pre .add { color: var(--green); } pre .del { color: var(--red); } pre .hunk { color: var(--blue); }
  .evidence { font-family: var(--mono); font-size: 13px; background: var(--panel-2); border-left: 3px solid var(--amber); padding: 8px 10px; margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
  .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .chip { font-family: var(--mono); font-size: 12px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; }
  .lifecycle { display: flex; gap: 4px; margin: 8px 0; flex-wrap: wrap; }
  .step { font-size: 11px; padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); color: var(--faint); }
  .step.done { color: var(--text); border-color: #4a4d55; }
  .step.current { color: var(--amber); border-color: var(--amber); }
  .step.current.v-ok { color: var(--green); border-color: var(--green); }
  .step.terminal { color: var(--red); border-color: var(--red); }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  td { padding: 3px 4px; border-top: 1px solid var(--border); vertical-align: top; }
  .event { display: grid; grid-template-columns: 70px 170px minmax(0, 1fr); gap: 8px; font-size: 12.5px; padding: 2px 0; border-bottom: 1px solid #222428; }
  .event .t { color: var(--faint); font-family: var(--mono); }
  .event .ty { font-family: var(--mono); color: var(--amber); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); padding: 18px 4px; }
  .findlist { margin-bottom: 14px; }
  #auth { position: fixed; inset: 0; background: rgba(10,10,12,.86); display: flex; align-items: center; justify-content: center; }
  #auth[hidden] { display: none; }
  #auth form { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 20px; width: min(420px, 92vw); }
  #auth input { width: 100%; margin: 10px 0; padding: 8px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: var(--mono); }
  #auth button { background: var(--amber); color: #1a1408; border: 0; border-radius: 4px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .stale-data section.panel, .stale-data #bottom > div { opacity: .72; }
  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto auto auto; height: auto; }
    #bottom { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <span class="wordmark">HIVE</span>
    <div class="stat"><span class="k">Repository</span><span class="v" id="s-repo">—</span></div>
    <div class="stat"><span class="k">Revision</span><span class="v" id="s-rev">—</span></div>
    <div class="stat"><span class="k">Active agents</span><span class="v" id="s-agents">—</span></div>
    <div class="stat"><span class="k">Unresolved findings</span><span class="v" id="s-findings">—</span></div>
    <div class="spacer"></div>
    <div class="stat"><span class="k">Model</span><span class="v" id="s-model">—</span></div>
    <div class="stat"><span class="k">Daemon</span><span class="v" id="s-conn">—</span></div>
  </header>
  <div id="banner"></div>
  <section class="panel" id="agents"><h2>Agents</h2></section>
  <section class="panel" id="center"><h2>Findings</h2></section>
  <section class="panel" id="contracts"><h2>Contracts</h2></section>
  <div id="bottom">
    <div id="events"><h2>Events</h2></div>
    <div id="verification"><h2>Latest verification run</h2></div>
  </div>
</div>
<div id="auth" hidden>
  <form id="auth-form" autocomplete="off">
    <h3>Connect to the Hive daemon</h3>
    <div class="muted small">Paste HIVE_TOKEN from .env. It is kept in this tab's sessionStorage only.</div>
    <input id="auth-token" type="password" spellcheck="false" placeholder="HIVE_TOKEN">
    <button type="submit">Connect</button>
    <div class="small" id="auth-msg" style="margin-top:8px;color:var(--red)"></div>
  </form>
</div>
<script>
'use strict';
// All dynamic data is rendered via textContent / text nodes. Never set markup from data.
const TOKEN_KEY = 'hive.token';
const POLL_MS = 2000;
const STALE_MS = 10000;
const INCOMPATIBLE = new Set(['assumption_mismatch', 'dependent_write', 'structural_incompatibility', 'claim_violation']);
const OVERLAP = new Set(['symbol_overlap', 'file_overlap']);

const state = { snapshot: null, lastOk: 0, lastError: null, lastJson: '', selected: null, timer: null, polling: false };

function getToken() { try { return sessionStorage.getItem(TOKEN_KEY); } catch { return null; } }
function setToken(v) { try { if (v) sessionStorage.setItem(TOKEN_KEY, v); else sessionStorage.removeItem(TOKEN_KEY); } catch { /* storage unavailable */ } }

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function add(parent, ...children) { for (const c of children) if (c) parent.appendChild(c); return parent; }
function clear(node, title) { node.replaceChildren(); if (title) node.appendChild(el('h2', null, title)); return node; }
function badge(text, cls) { return el('span', 'badge ' + cls, text); }
function time(at) { return at ? new Date(at).toLocaleTimeString() : '—'; }
function ago(ms) { const s = Math.round(ms / 1000); return s < 60 ? s + ' s' : Math.round(s / 60) + ' min'; }

function sessionName(id) {
  const s = state.snapshot && state.snapshot.sessions.find(x => x.id === id);
  return s ? s.name : String(id).slice(0, 8);
}
function findingCategory(f) {
  if (INCOMPATIBLE.has(f.kind)) return { label: 'incompatible assumption', cls: 'b-incompat' };
  if (OVERLAP.has(f.kind)) return { label: 'potential overlap', cls: 'b-overlap' };
  if (f.kind === 'direct_edit') return { label: 'direct edit outside Hive', cls: 'b-neutral' };
  return { label: f.kind, cls: 'b-neutral' };
}
function findingKey(f) { return f.kind + '|' + (f.sessions || []).join(',') + '|' + f.evidence; }
function verifiedWithEvidence(c) { return c.status === 'verified' && !!(c.evidence && c.evidence.verification && c.evidence.verification.passed === true); }
function contractBadge(c) {
  if (c.status === 'verified') return verifiedWithEvidence(c) ? badge('implementation verified', 'b-verified') : badge('verified — no passing run on record', 'b-warn');
  if (c.status === 'accepted') return badge('agreement accepted', 'b-accepted');
  if (c.status === 'implemented') return badge('implemented, not verified', 'b-accepted');
  if (c.status === 'proposed') return badge('proposed', 'b-neutral');
  return badge(c.status, 'b-incompat');
}

// ---------- top bar ----------
function renderTop() {
  const snap = state.snapshot; const now = Date.now();
  const conn = document.getElementById('s-conn');
  const banner = document.getElementById('banner');
  banner.className = ''; banner.textContent = '';
  document.getElementById('app').classList.remove('stale-data');
  conn.replaceChildren();
  if (state.lastError && (!state.lastOk || now - state.lastOk > STALE_MS)) {
    add(conn, el('span', 'dot bad'), document.createTextNode('offline'));
    banner.className = 'offline';
    banner.textContent = 'Offline: cannot reach the daemon (' + state.lastError + ').' + (state.lastOk ? ' Showing data from ' + time(state.lastOk) + ', ' + ago(now - state.lastOk) + ' old.' : ' No data received yet.');
    if (state.lastOk) document.getElementById('app').classList.add('stale-data');
  } else if (state.lastOk && now - state.lastOk > STALE_MS) {
    add(conn, el('span', 'dot warn'), document.createTextNode('stale'));
    banner.className = 'stale';
    banner.textContent = 'Stale: last successful update ' + ago(now - state.lastOk) + ' ago (' + time(state.lastOk) + ').';
    document.getElementById('app').classList.add('stale-data');
  } else if (state.lastOk) {
    add(conn, el('span', 'dot ok'), document.createTextNode('live · ' + time(state.lastOk)));
  } else {
    add(conn, el('span', 'dot off'), document.createTextNode('connecting'));
  }
  if (!snap) return;
  const repo = document.getElementById('s-repo');
  repo.textContent = snap.repository.canonicalRoot; repo.title = snap.repository.canonicalRoot;
  document.getElementById('s-rev').textContent = 'r' + snap.repository.revision + (snap.graph ? ' · ' + snap.graph.symbols + ' symbols' : '');
  const active = snap.sessions.filter(s => s.status === 'active' && s.expiresAt > now).length;
  document.getElementById('s-agents').textContent = String(active);
  const unresolved = snap.findings.filter(f => f.severity !== 'info').length;
  const overlaps = snap.findings.length - unresolved;
  document.getElementById('s-findings').textContent = unresolved + ' conflicting · ' + overlaps + ' informational';
  const model = document.getElementById('s-model'); model.replaceChildren();
  const ms = modelStatus(snap);
  add(model, el('span', 'dot ' + ms.dot), document.createTextNode(ms.text));
  model.title = ms.detail || '';
}
function modelStatus(snap) {
  const m = snap.model || { configured: false, model: '' };
  const a = snap.analysis;
  if (!m.configured) return { dot: 'off', text: 'model unavailable (not configured)', detail: 'Set a model API key in .env to enable semantic analysis. Deterministic and compiler checks still run.' };
  if (a && (a.status === 'unavailable' || a.status === 'invalid')) return { dot: 'bad', text: 'model ' + a.status + (m.model ? ' · ' + m.model : ''), detail: a.error || '' };
  if (!a) return { dot: 'off', text: (m.model || 'model') + ' · no analysis yet' };
  if (a.status === 'stale') return { dot: 'warn', text: (a.model || m.model) + ' · analysis stale (r' + a.revision + ')' };
  return { dot: 'ok', text: (a.model || m.model) + ' · ' + a.status + ' r' + a.revision + (a.latencyMs != null ? ' · ' + a.latencyMs + ' ms' : '') };
}

// ---------- agents ----------
function renderAgents() {
  const root = clear(document.getElementById('agents'), 'Agents');
  const snap = state.snapshot; if (!snap) return;
  const now = Date.now();
  const sessions = snap.sessions.slice().sort((a, b) => (a.status === 'active' ? 0 : 1) - (b.status === 'active' ? 0 : 1) || a.name.localeCompare(b.name));
  if (!sessions.length) {
    add(root, el('div', 'empty', 'No agents registered. Connect an MCP client (npm run mcp) and call hive_register to see it here.'));
    return;
  }
  for (const s of sessions) {
    const intent = snap.intents.find(i => i.sessionId === s.id);
    const ws = snap.workspaces.find(w => w.id === s.workspaceId);
    const card = el('div', 'card');
    const head = el('div', 'row');
    add(head, el('h3', null, s.name));
    const remaining = s.expiresAt - now;
    let lease;
    if (s.status !== 'active') lease = badge(s.status, 'b-neutral');
    else if (remaining <= 0) lease = badge('lease expired ' + ago(-remaining) + ' ago', 'b-incompat');
    else if (remaining < 15000) lease = badge('lease expiring · ' + ago(remaining), 'b-warn');
    else lease = badge('heartbeat ok · ' + ago(remaining) + ' left', 'b-neutral');
    add(head, lease);
    add(card, head);
    add(card, el('div', 'small', intent ? intent.task : 'No intent declared'));
    add(card, el('div', 'small muted mono', 'workspace ' + (ws ? ws.realRoot : s.workspaceId)));
    add(card, el('div', 'small muted', intent ? 'intent revision ' + intent.revision + ' · updated ' + time(intent.at) : 'intent revision —'));
    if (intent && intent.assumptions.length) {
      const chips = el('div', 'chips');
      for (const a of intent.assumptions) add(chips, el('span', 'chip', a.key + ' = ' + a.value));
      add(card, chips);
    }
    if (s.client) add(card, el('div', 'small faint', 'client ' + s.client));
    add(root, card);
  }
}

// ---------- center: selected finding ----------
function relatedContract(f) {
  const snap = state.snapshot; const syms = new Set(f.symbols || []); const sess = new Set(f.sessions || []);
  const live = snap.contracts.filter(c => !['rejected', 'cancelled'].includes(c.status));
  return live.find(c => c.producerSymbol && syms.has(c.producerSymbol))
    || live.find(c => c.participants.filter(p => sess.has(p)).length >= Math.min(2, sess.size) && sess.size > 0)
    || null;
}
function relatedProposal(f, contract) {
  const syms = new Set(f.symbols || []); if (contract && contract.producerSymbol) syms.add(contract.producerSymbol);
  return state.snapshot.proposals.slice().sort((a, b) => b.updatedAt - a.updatedAt)
    .find(p => p.preview && p.preview.symbol && syms.has(p.preview.symbol)) || null;
}
function diffPre(text) {
  const pre = el('pre');
  for (const line of String(text).split('\n')) {
    const cls = line.startsWith('+') && !line.startsWith('+++') ? 'add' : line.startsWith('-') && !line.startsWith('---') ? 'del' : line.startsWith('@@') ? 'hunk' : null;
    add(pre, el('span', cls, line + '\n'));
  }
  return pre;
}
function chipList(label, items) {
  if (!items || !items.length) return null;
  const wrap = el('div');
  add(wrap, el('div', 'label', label));
  const chips = el('div', 'chips'); for (const i of items) add(chips, el('span', 'chip', i));
  return add(wrap, chips);
}

function renderCenter() {
  const root = clear(document.getElementById('center'), 'Findings');
  const snap = state.snapshot; if (!snap) { add(root, el('div', 'empty', 'Waiting for the first snapshot…')); return; }
  const findings = snap.findings.slice().sort((a, b) => sevRank(a) - sevRank(b));
  if (!snap.sessions.length) add(root, el('div', 'empty', 'Nothing to coordinate yet: no agent sessions exist.'));
  else if (!findings.length) add(root, el('div', 'empty', 'No findings. No overlapping scope or incompatible assumptions have been detected among current intents.'));
  if (findings.length) {
    if (!state.selected || !findings.some(f => findingKey(f) === state.selected)) state.selected = findingKey(findings[0]);
    const list = el('div', 'findlist');
    for (const f of findings) {
      const cat = findingCategory(f); const key = findingKey(f);
      const item = el('div', 'card selectable' + (key === state.selected ? ' selected' : ''));
      item.tabIndex = 0;
      const row = el('div', 'row');
      add(row, badge(cat.label, cat.cls), el('span', 'mono small', f.kind), el('span', 'small muted', (f.sessions || []).map(sessionName).join(' ↔ ')));
      add(item, row);
      const ev = el('div', 'small muted', f.evidence.length > 140 ? f.evidence.slice(0, 140) + '…' : f.evidence);
      add(item, ev);
      const pick = () => { state.selected = key; renderCenter(); };
      item.addEventListener('click', pick);
      item.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      add(list, item);
    }
    add(root, list);
    const f = findings.find(x => findingKey(x) === state.selected);
    if (f) add(root, findingDetail(f));
  }
  const a = snap.analysis;
  if (a && a.findings && a.findings.length) {
    add(root, el('h2', null, 'Model analysis (proposals only, not proof)'));
    add(root, el('div', 'small muted', 'Status ' + a.status + ' · revision ' + a.revision + ' · ' + time(a.at) + (a.status === 'stale' ? ' · repository changed since analysis' : '')));
    for (const mf of a.findings) {
      const card = el('div', 'card');
      const cls = mf.kind === 'harmless_overlap' ? 'b-overlap' : mf.kind === 'needs_clarification' ? 'b-warn' : 'b-incompat';
      add(card, add(el('div', 'row'), badge(mf.kind.replace(/_/g, ' '), cls), el('span', 'small muted', mf.sessionIds.map(sessionName).join(' ↔ ') + ' · confidence ' + mf.confidence)));
      add(card, el('div', 'small', mf.explanation));
      if (mf.evidence.length) add(card, chipList('Cited evidence', mf.evidence));
      if (mf.suggestion) add(card, el('div', 'small muted', 'Suggestion: ' + mf.suggestion));
      if (mf.proposedDeclaration) { add(card, el('div', 'label', 'Suggested declaration (unvalidated)')); add(card, el('pre', null, mf.proposedDeclaration)); }
      add(root, card);
    }
  }
}
function sevRank(f) { return f.severity === 'error' ? 0 : f.severity === 'warning' ? 1 : 2; }

function findingDetail(f) {
  const cat = findingCategory(f);
  const card = el('div', 'card');
  add(card, add(el('div', 'row'), badge(cat.label, cat.cls), el('span', 'mono small', f.kind), badge(f.severity, f.severity === 'error' ? 'b-incompat' : f.severity === 'warning' ? 'b-warn' : 'b-neutral'), el('span', 'small faint', 'source: ' + f.source)));
  add(card, el('div', 'small', 'Between ' + (f.sessions || []).map(sessionName).join(' and ')));
  add(card, el('div', 'evidence', f.evidence));
  add(card, chipList('Affected symbols', f.symbols));
  add(card, chipList('Affected files', f.files));
  if (OVERLAP.has(f.kind)) add(card, el('div', 'small muted', 'Shared scope only. This is a candidate, not a proven semantic conflict.'));
  const contract = relatedContract(f);
  if (contract) {
    add(card, el('div', 'label', 'Proposed interface · contract "' + contract.title + '" v' + contract.version));
    add(card, add(el('div', 'row'), contractBadge(contract), el('span', 'small muted', contract.producerSymbol || 'no producer symbol')));
    add(card, el('pre', null, contract.declaration));
    if (contract.behaviorNotes) add(card, el('div', 'small muted', contract.behaviorNotes));
    const impl = contract.evidence && contract.evidence.implemented;
    if (impl) {
      add(card, el('div', 'label', 'Current implementation (r' + impl.revision + ', ' + impl.file + ')'));
      add(card, el('pre', null, impl.declaration));
    }
  } else {
    add(card, el('div', 'label', 'Proposed interface'));
    add(card, el('div', 'small muted', 'No contract proposed for these sessions yet.'));
  }
  const proposal = relatedProposal(f, contract);
  if (proposal && proposal.preview) {
    add(card, el('div', 'label', 'Operation ' + proposal.operation.kind + ' · ' + proposal.status + ' · base r' + proposal.baseRevision + ' (before → after)'));
    add(card, diffPre(proposal.preview.diff || '(empty diff)'));
    if (proposal.preview.newDiagnostics.length) add(card, chipList('New diagnostics', proposal.preview.newDiagnostics.map(d => d.file + ':' + d.line + ' TS' + d.code + ' ' + d.message)));
    if (proposal.preview.rejections.length) add(card, chipList('Rejections', proposal.preview.rejections));
  }
  return card;
}

// ---------- right: contracts ----------
const FLOW = ['proposed', 'accepted', 'implemented', 'verified'];
function renderContracts() {
  const root = clear(document.getElementById('contracts'), 'Contracts');
  const snap = state.snapshot; if (!snap) return;
  if (!snap.contracts.length) { add(root, el('div', 'empty', 'No contracts proposed.')); return; }
  const contracts = snap.contracts.slice().sort((a, b) => b.updatedAt - a.updatedAt);
  for (const c of contracts) {
    const card = el('div', 'card');
    add(card, el('h3', null, c.title));
    add(card, add(el('div', 'row'), contractBadge(c), el('span', 'small muted', 'v' + c.version + ' · owner ' + sessionName(c.ownerSessionId))));
    const life = el('div', 'lifecycle');
    const idx = FLOW.indexOf(c.status);
    FLOW.forEach((step, i) => {
      let cls = 'step';
      if (idx >= 0 && i < idx) cls += ' done';
      if (i === idx) cls += ' current' + (step === 'verified' && verifiedWithEvidence(c) ? ' v-ok' : '');
      add(life, el('span', cls, step));
    });
    if (idx < 0) add(life, el('span', 'step terminal', c.status));
    add(card, life);
    if (c.status === 'stale' && c.evidence && c.evidence.staleReason) add(card, el('div', 'small', 'Stale: ' + c.evidence.staleReason));
    add(card, el('div', 'label', 'Acknowledgement of v' + c.version));
    const table = el('table');
    for (const p of c.participants) {
      const acks = (c.acknowledgementDetails || []).filter(a => a.sessionId === p);
      const exact = acks.find(a => a.version === c.version);
      const latest = acks.slice().sort((a, b) => b.version - a.version)[0];
      const tr = el('tr');
      add(tr, el('td', null, sessionName(p)));
      const td = el('td');
      if (exact) add(td, badge('acknowledged v' + exact.version, 'b-accepted'), el('span', 'small muted', ' intent r' + exact.intentRevision + ' · ' + time(exact.at)));
      else if (latest) add(td, badge('only v' + latest.version + ' (outdated)', 'b-warn'));
      else add(td, badge('pending', 'b-neutral'));
      add(tr, td); add(table, tr);
    }
    add(card, table);
    const v = c.evidence && c.evidence.verification;
    if (v) {
      add(card, el('div', 'label', 'Verification evidence'));
      add(card, add(el('div', 'row'), badge(v.passed ? 'passed' : 'failed', v.passed ? 'b-verified' : 'b-incompat'), el('span', 'mono small', '$ ' + v.command)));
      add(card, el('div', 'small muted', 'exit ' + v.exitCode + ' · v' + v.version + ' · revision r' + v.revision + (v.overlay ? ' · overlay' : '') + ' · ' + Object.keys(v.sourceHashes || {}).length + ' source hashes · ' + time(v.at)));
    } else if (c.status === 'verified') {
      add(card, el('div', 'small', 'No verification run recorded; not shown as verified.'));
    }
    const oc = c.evidence && c.evidence.overlayCheck;
    if (oc) add(card, el('div', 'small muted', 'Overlay check ' + (oc.ok ? 'ok' : 'failed: ' + oc.diagnostics.length + ' diagnostics') + ' · ' + time(oc.at)));
    add(root, card);
  }
}

// ---------- bottom ----------
function renderEvents() {
  const root = document.getElementById('events');
  const atBottom = root.scrollHeight - root.scrollTop - root.clientHeight < 30;
  clear(root, 'Events');
  const snap = state.snapshot; if (!snap) return;
  if (!snap.events.length) { add(root, el('div', 'empty', 'No events recorded.')); return; }
  const events = snap.events.slice().sort((a, b) => a.seq - b.seq);
  for (const e of events) {
    const row = el('div', 'event');
    add(row, el('span', 't', time(e.at)), el('span', 'ty', e.type), el('span', null, e.detail));
    row.title = '#' + e.seq;
    add(root, row);
  }
  if (atBottom) root.scrollTop = root.scrollHeight;
}
function renderVerification() {
  const root = clear(document.getElementById('verification'), 'Latest verification run');
  const snap = state.snapshot; if (!snap) return;
  const runs = snap.contracts.map(c => c.evidence && c.evidence.verification ? { c, v: c.evidence.verification } : null).filter(Boolean).sort((a, b) => b.v.at - a.v.at);
  if (!runs.length) { add(root, el('div', 'empty', 'No verification has been run.')); return; }
  const { c, v } = runs[0];
  add(root, add(el('div', 'row'), badge(v.passed ? 'passed' : 'failed', v.passed ? 'b-verified' : 'b-incompat'), el('span', 'small', c.title + ' v' + v.version)));
  add(root, el('div', 'mono small', '$ ' + v.command));
  add(root, el('div', 'small muted', 'exit code ' + v.exitCode + ' · revision r' + v.revision + ' · ' + time(v.at)));
  const hashes = Object.entries(v.sourceHashes || {});
  if (hashes.length) add(root, chipList('Source hashes', hashes.map(([f, h]) => f + ' ' + String(h).slice(0, 12))));
  add(root, el('pre', null, v.output || '(no output captured)'));
}

function renderAll() { renderTop(); renderAgents(); renderCenter(); renderContracts(); renderEvents(); renderVerification(); }

// ---------- polling ----------
async function poll() {
  const token = getToken();
  if (!token) { showAuth(); return; }
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 5000);
  try {
    const res = await fetch('/snapshot', { headers: { Authorization: 'Bearer ' + token }, cache: 'no-store', signal: ctrl.signal });
    if (res.status === 401) { setToken(null); showAuth('Token rejected (401). Paste the current HIVE_TOKEN.'); return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    state.lastOk = Date.now(); state.lastError = null;
    if (text !== state.lastJson) { state.lastJson = text; state.snapshot = JSON.parse(text); renderAll(); }
    else { renderTop(); renderAgents(); }
  } catch (error) {
    state.lastError = error && error.name === 'AbortError' ? 'timeout' : (error && error.message) || 'fetch failed';
    renderTop(); if (state.snapshot) renderAgents();
  } finally { clearTimeout(t); }
  schedule();
}
function schedule() { clearTimeout(state.timer); state.timer = setTimeout(poll, POLL_MS); }
function showAuth(message) {
  clearTimeout(state.timer);
  document.getElementById('auth').hidden = false;
  document.getElementById('auth-msg').textContent = message || '';
  document.getElementById('auth-token').focus();
}
document.getElementById('auth-form').addEventListener('submit', e => {
  e.preventDefault();
  const input = document.getElementById('auth-token');
  const v = input.value.trim(); input.value = '';
  if (!v) return;
  setToken(v);
  document.getElementById('auth').hidden = true;
  poll();
});
// Re-evaluate stale/offline banners even if a request hangs.
setInterval(() => { if (getToken()) renderTop(); }, 1000);
renderAll();
poll();
</script>
</body>
</html>
